name: Release

permissions: {}

on:
  # Publishing a release (in the GitHub UI or with `gh release create vX.Y.Z`)
  # builds and attaches its assets. The tag's version must match the packages,
  # so bump with `bun run set-version X.Y.Z --no-tag` and merge that first.
  release:
    types: [published]
  # Re-runs the asset build for a release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build assets for, e.g. v0.9.0
        required: true
        type: string

jobs:
  prepare:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Resolve release
        id: release
        run: |
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Require the tag to match the package version
        run: |
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p 'require("./packages/cli/package.json").version')"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $TAG is version $VERSION, but packages/cli/package.json is $PACKAGE_VERSION. Run \`bun run set-version $VERSION --no-tag\`, merge it to main, then delete and recreate the release."
            exit 1
          fi
          echo "Releasing $VERSION from $(git rev-parse HEAD)"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # verify-packed-manifests packs each workspace with pnpm.
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run verify:packed-manifests

      - name: Build portable agent plugin
        run: node scripts/package-agent-plugin.mjs

      - name: Attach portable plugin to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/hyperframes-agent-plugin.zip dist/hyperframes-agent-plugin.sha256 dist/hyperframes-agent-plugin.json --repo "$REPO" --clobber

  # The CLI ships as standalone binaries on the release, not on npm. Each target
  # builds on its own platform so the smoke test runs the binary it uploads.
  binaries:
    name: Binary (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install ffmpeg
        if: matrix.target == 'linux-x64'
        uses: ./.github/actions/install-ffmpeg-linux
      - name: Install ffmpeg
        if: matrix.target == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg
        if: matrix.target == 'darwin-arm64'
        run: brew install ffmpeg
      - uses: ./.github/actions/prepare-ffmpeg-bin
      - run: bash scripts/ci/install-workspace-dependencies.sh
      - run: bun run build
      - run: bun packages/cli/scripts/build-binary.ts --target ${{ matrix.target }}
      - name: Smoke-test the binary without Node, npm or Bun
        run: bash scripts/ci/binary-smoke.sh packages/cli/.binary/hyperframes-${{ matrix.target }}
      - name: Attach the binary to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release upload "$TAG" \
            "packages/cli/.binary/hyperframes-${TARGET}" \
            "packages/cli/.binary/hyperframes-${TARGET}.sha256" \
            --repo "$REPO" --clobber
