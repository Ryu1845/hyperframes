name: Release

permissions: {}

on:
  push:
    tags:
      # Stable tags are created only by a merged, reviewed release PR. Direct
      # tag pushes are reserved for prerelease channels.
      - "v*-*"
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EXPECTED_RELEASE_SHA: >-
        ${{ github.event_name == 'pull_request'
            && github.event.pull_request.merge_commit_sha
            || github.sha }}
    # Stable releases come only from reviewed release PRs. Tag pushes are
    # prerelease-only because the trigger pattern requires a hyphenated version.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Pin every release to an immutable ref. In particular, a merged
          # release PR event exposes main as github.ref, which may advance
          # before this job starts; use the event's exact merge commit instead.
          ref: ${{ env.EXPECTED_RELEASE_SHA }}

      - name: Verify immutable release checkout
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_COMMIT_SHA="$(git rev-parse "${EXPECTED_RELEASE_SHA}^{commit}")"
          if [ "$ACTUAL_SHA" != "$EXPECTED_COMMIT_SHA" ]; then
            echo "::error::Expected release commit $EXPECTED_COMMIT_SHA, checked out $ACTUAL_SHA"
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BRANCH="${PR_HEAD_REF}"
            VERSION="${BRANCH#release/v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Detect pre-release tag (e.g. 0.1.16-alpha.1 → alpha, 0.1.16-beta.2 → beta)
          if [[ "$VERSION" =~ -([a-zA-Z]+) ]]; then
            DIST_TAG="${BASH_REMATCH[1]}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            DIST_TAG="latest"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} dist_tag=${DIST_TAG}"

      - name: Validate release channel
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/validate-release-channel.mjs

      - name: Create release tag
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          EXPECTED_TAG_SHA="$(git rev-parse HEAD)"

          verify_remote_tag() {
            git fetch --force --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
            ACTUAL_TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$ACTUAL_TAG_SHA" != "$EXPECTED_TAG_SHA" ]; then
              echo "::error::Release tag $TAG points to $ACTUAL_TAG_SHA, expected $EXPECTED_TAG_SHA"
              exit 1
            fi
            echo "Release tag $TAG already exists at the expected commit — skipping"
          }

          if [ -n "$(git ls-remote --refs origin "refs/tags/$TAG")" ]; then
            verify_remote_tag
          else
            git tag --no-sign "$TAG" "$EXPECTED_TAG_SHA"
            if ! git push origin "refs/tags/$TAG"; then
              # A concurrent retry may have created the tag after ls-remote.
              git tag -d "$TAG"
              verify_remote_tag
            fi
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run verify:packed-manifests

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          NOTES_FILE="releases/v${VERSION}.md"

          # Skip if release already exists (idempotent re-runs)
          if gh release view "v${VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — skipping"
          else
            FLAGS=(--repo "$REPO" --title "v${VERSION}")
            if [ -f "$NOTES_FILE" ]; then
              FLAGS+=(--notes-file "$NOTES_FILE")
            else
              echo "No reviewed release notes found at $NOTES_FILE — using GitHub generated notes"
              FLAGS+=(--generate-notes)
            fi
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "v${VERSION}" "${FLAGS[@]}"
          fi

      - name: Build portable agent plugin
        run: node scripts/package-agent-plugin.mjs

      - name: Attach portable plugin to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release upload "v${VERSION}" dist/hyperframes-agent-plugin.zip dist/hyperframes-agent-plugin.sha256 dist/hyperframes-agent-plugin.json --repo "$REPO" --clobber

  # The CLI ships as standalone binaries on the release, not on npm. Each target
  # builds on its own platform so the smoke test runs the binary it uploads.
  binaries:
    name: Binary (${{ matrix.target }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    env:
      EXPECTED_RELEASE_SHA: >-
        ${{ github.event_name == 'pull_request'
            && github.event.pull_request.merge_commit_sha
            || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_RELEASE_SHA }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install ffmpeg
        if: matrix.target == 'linux-x64'
        uses: ./.github/actions/install-ffmpeg-linux
      - name: Install ffmpeg
        if: matrix.target == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg
        if: matrix.target == 'darwin-arm64'
        run: brew install ffmpeg
      - uses: ./.github/actions/prepare-ffmpeg-bin
      - run: bash scripts/ci/install-workspace-dependencies.sh
      - run: bun run build
      - run: bun packages/cli/scripts/build-binary.ts --target ${{ matrix.target }}
      - name: Smoke-test the binary without Node, npm or Bun
        run: bash scripts/ci/binary-smoke.sh packages/cli/.binary/hyperframes-${{ matrix.target }}
      - name: Attach the binary to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release upload "v${VERSION}" \
            "packages/cli/.binary/hyperframes-${TARGET}" \
            "packages/cli/.binary/hyperframes-${TARGET}.sha256" \
            --repo "$REPO" --clobber
